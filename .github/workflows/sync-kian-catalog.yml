name: Sincronizar catálogo Kian

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kian-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comparar catálogo com a Loja Kian
        run: node scripts/sync-kian-catalog.mjs

      - name: Publicar somente quando houver alterações
        shell: bash
        run: |
          if git diff --quiet -- src/data/kian-products.json; then
            echo "Catálogo sem alterações."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/kian-products.json
          git commit -m "chore: sincroniza catálogo da Kian"
          git push
